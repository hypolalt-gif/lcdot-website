<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakeview DOT | Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f1115;
            --panel: #16181d;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --gold: #d4af37;
            --border: #2d3139;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 250px; background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .brand { padding: 1.5rem; border-bottom: 1px solid var(--border); text-align: center; }
        .brand h1 { font-family: 'Merriweather', serif; font-size: 1.2rem; color: white; }
        .nav { padding: 1rem 0; flex: 1; }
        .nav-btn { display: block; width: 100%; text-align: left; padding: 0.8rem 1.5rem; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; cursor: pointer; border-left: 2px solid transparent; }
        .nav-btn:hover { color: white; background: rgba(255,255,255,0.02); }
        .nav-btn.active { color: var(--gold); border-left-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .logout { padding: 1rem; border-top: 1px solid var(--border); }
        .logout a { display: block; text-align: center; color: var(--danger); text-decoration: none; font-size: 0.85rem; padding: 0.5rem; border: 1px solid var(--danger); }

        /* Main */
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .topbar { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
        .user { display: flex; gap: 1rem; align-items: center; }
        .user img { width: 40px; height: 40px; border-radius: 2px; }
        .user h2 { font-size: 1rem; }
        .user p { font-size: 0.8rem; color: var(--gold); }
        
        .content { padding: 2rem; max-width: 1000px; margin: 0 auto; width: 100%; }
        .tab { display: none; }
        .tab.active { display: block; }
        .page-title { font-family: 'Merriweather', serif; font-size: 1.5rem; color: var(--gold); margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        .panel { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; }
        .panel h3 { font-size: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 500; }
        td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        
        input, select, textarea { width: 100%; padding: 0.75rem; background: var(--bg); border: 1px solid var(--border); color: white; margin-bottom: 1rem; font-family: inherit; }
        .btn { background: var(--gold); color: #000; border: none; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer; font-family: inherit; }
        .btn-red { background: var(--danger); color: white; }
        
        .timer { font-size: 3rem; font-family: monospace; text-align: center; margin: 2rem 0; color: white; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand"><h1>LCDOT Portal</h1></div>
        <div class="nav">
            <button onclick="switchTab('dashboard', this)" class="nav-btn active">Overview</button>
            <button onclick="switchTab('profile', this)" class="nav-btn">My Profile</button>
            <button onclick="switchTab('activity', this)" class="nav-btn">Activity Logs</button>
            <button onclick="switchTab('loa', this)" class="nav-btn">Leave of Absence</button>
            <button onclick="switchTab('documents', this)" class="nav-btn">Handbook & Policies</button>
            <button onclick="switchTab('management', this)" id="nav-mgmt" class="nav-btn" style="display:none;">Management HQ</button>
        </div>
        <div class="logout"><a href="/logout">Log Out</a></div>
    </aside>

    <main class="main">
        <header class="topbar">
            <div class="user">
                <img id="user-avatar" src="">
                <div>
                    <h2 id="user-name">Loading...</h2>
                    <p id="user-rank">...</p>
                </div>
            </div>
            <div style="text-align: right;">
                <p style="font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase;">Total Hours</p>
                <h3 id="total-hours" style="font-size: 1.2rem;">0.0</h3>
            </div>
        </header>

        <div class="content">
            <div id="tab-dashboard" class="tab active">
                <h2 class="page-title">System Overview</h2>
                <div class="panel">
                    <h3>Welcome, <span id="dash-name"></span></h3>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Use the sidebar to log your shifts and submit roadwork reports.</p>
                </div>
            </div>

            <div id="tab-profile" class="tab">
                <h2 class="page-title">Personnel File</h2>
                <div class="panel">
                    <table>
                        <thead><tr><th>Division</th><th>Status</th><th>Date</th></tr></thead>
                        <tbody id="profile-certs"></tbody>
                    </table>
                </div>
            </div>

            <!-- LOA, Activity, Documents, Management Tabs would go here (same logic as before) -->

        </div>
    </main>

    <script>
        let user = {};
        function switchTab(id, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            btn.classList.add('active');
        }

        async function init() {
            const res = await fetch('/api/me');
            if (!res.ok) return window.location.href = '/';
            user = await res.json();
            document.getElementById('user-name').innerText = user.username;
            document.getElementById('dash-name').innerText = user.username;
            document.getElementById('user-rank').innerText = user.rank;
            document.getElementById('user-avatar').src = user.avatar_url;
            if (user.rankLevel >= 5) document.getElementById('nav-mgmt').style.display = 'block';
        }
        init();
    </script>
</body>
</html>
