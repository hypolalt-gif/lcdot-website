<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCDOT | Employee Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0a;
            --panel: #121212;
            --sidebar: #161616;
            --text: #f4f4f5;
            --text-muted: #a1a1aa;
            --gold: #d4af37;
            --border: #27272a;
            --danger: #ef4444;
            --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }

        /* Sidebar */
        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .brand { padding: 1.5rem; border-bottom: 1px solid var(--border); text-align: center; }
        .brand h1 { font-family: 'Merriweather', serif; font-size: 1.1rem; color: var(--gold); }
        .nav { padding: 1rem 0; flex: 1; overflow-y: auto; }
        .nav-item { display: block; width: 100%; text-align: left; padding: 0.8rem 1.5rem; background: none; border: none; color: var(--text-muted); font-size: 0.9rem; font-weight: 500; cursor: pointer; transition: 0.2s; }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.02); }
        .nav-item.active { color: var(--gold); border-left: 3px solid var(--gold); background: rgba(212, 175, 55, 0.05); }
        .logout-area { padding: 1rem; border-top: 1px solid var(--border); }
        .logout-btn { display: block; text-align: center; background: rgba(239, 68, 68, 0.1); color: var(--danger); padding: 0.6rem; text-decoration: none; font-size: 0.85rem; border: 1px solid rgba(239, 68, 68, 0.2); font-weight: 600; }

        /* Main Content */
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .user-info img { width: 40px; height: 40px; border-radius: 4px; border: 1px solid var(--border); }
        .user-info h2 { font-size: 1rem; color: white; }
        .user-info p { font-size: 0.8rem; color: var(--gold); font-weight: 600; }
        
        .content-area { padding: 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
        .page { display: none; animation: fadeIn 0.2s ease-in-out; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .page-title { font-family: 'Merriweather', serif; font-size: 1.4rem; color: var(--gold); margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); }

        /* Panels & Tables */
        .panel { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; }
        .panel-title { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); margin-bottom: 1rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 500; }
        td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(255,255,255,0.01); }

        /* Shift Center Specific */
        .shift-clock { text-align: center; padding: 2rem 0; }
        .shift-timer { font-family: monospace; font-size: 3.5rem; font-weight: 700; color: white; margin-bottom: 1rem; }
        .btn-shift { padding: 0.8rem 2rem; border: none; border-radius: 4px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .btn-start { background: var(--success); color: #000; }
        .btn-start:hover { background: #16a34a; }
        .btn-stop { background: var(--danger); color: white; }
        .btn-stop:hover { background: #dc2626; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand"><h1>LCDOT Portal</h1></div>
        <div class="nav">
            <button onclick="switchPage('dashboard', this)" class="nav-item active">Dashboard</button>
            <button onclick="switchPage('profile', this)" class="nav-item">My Profile</button>
            <button onclick="switchPage('shifts', this)" class="nav-item">Shift Center</button>
        </div>
        <div class="logout-area"><a href="/logout" class="logout-btn">Log Out</a></div>
    </aside>

    <main class="main">
        <header class="header">
            <div class="user-info">
                <img id="user-avatar" src="" alt="User">
                <div>
                    <h2 id="user-name">Loading...</h2>
                    <p id="user-rank">...</p>
                </div>
            </div>
        </header>

        <div class="content-area">
            
            <div id="page-dashboard" class="page active">
                <h2 class="page-title">Dashboard Overview</h2>
                <div class="panel">
                    <div class="panel-title">Welcome</div>
                    <p style="color: var(--text-muted);">Select a module from the sidebar to begin your shift or submit logs.</p>
                </div>
            </div>

            <div id="page-profile" class="page">
                <h2 class="page-title">My Profile</h2>
                <div class="panel"><p style="color: var(--text-muted);">Profile data loading...</p></div>
            </div>
            
            <!-- SHIFT CENTER TAB -->
            <div id="page-shifts" class="page">
                <h2 class="page-title">Shift Center</h2>
                
                <div class="panel">
                    <div class="panel-title">Shift Timer</div>
                    <div class="shift-clock">
                        <div class="shift-timer" id="timer-display">00:00:00</div>
                        <button id="btn-clockin" class="btn-shift btn-start" onclick="clockIn()">Clock In</button>
                        <button id="btn-clockout" class="btn-shift btn-stop hidden" onclick="clockOut()">Clock Out</button>
                    </div>
                </div>

                <div class="panel">
                    <div class="panel-title">Recent Shift History</div>
                    <table>
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Start Time</th>
                                <th>End Time</th>
                                <th>Duration</th>
                            </tr>
                        </thead>
                        <tbody id="shift-history-body">
                            <tr><td colspan="4" style="text-align:center;">Loading history...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script>
        let user = {};
        let timerInterval;

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if (btn) btn.classList.add('active');
            
            if (pageId === 'shifts') loadShiftData();
        }

        async function init() {
            const res = await fetch('/api/me');
            if (!res.ok) return window.location.href = '/';
            user = await res.json();
            
            document.getElementById('user-name').innerText = user.username;
            document.getElementById('user-rank').innerText = user.rank;
            document.getElementById('user-avatar').src = user.avatar_url;
        }

        // --- SHIFT CENTER LOGIC ---
        async function loadShiftData() {
            // Check for active shift
            const activeRes = await fetch('/api/shifts/active');
            const activeShift = await activeRes.json();

            if (activeShift) {
                document.getElementById('btn-clockin').classList.add('hidden');
                document.getElementById('btn-clockout').classList.remove('hidden');
                startTimer(new Date(activeShift.start_time).getTime());
            } else {
                document.getElementById('btn-clockin').classList.remove('hidden');
                document.getElementById('btn-clockout').classList.add('hidden');
                document.getElementById('timer-display').innerText = "00:00:00";
                clearInterval(timerInterval);
            }

            // Load history
            const historyRes = await fetch('/api/shifts/history');
            const history = await historyRes.json();
            
            const tbody = document.getElementById('shift-history-body');
            if (history.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No recent shifts.</td></tr>';
            } else {
                tbody.innerHTML = history.map(s => {
                    const start = new Date(s.start_time);
                    const end = new Date(s.end_time);
                    return `
                        <tr>
                            <td>${start.toLocaleDateString()}</td>
                            <td>${start.toLocaleTimeString()}</td>
                            <td>${end.toLocaleTimeString()}</td>
                            <td>${s.duration_minutes} mins</td>
                        </tr>
                    `;
                }).join('');
            }
        }

        function startTimer(startTimeMs) {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const diff = Date.now() - startTimeMs;
                const h = Math.floor(diff / 3600000).toString().padStart(2, '0');
                const m = Math.floor((diff % 3600000) / 60000).toString().padStart(2, '0');
                const s = Math.floor((diff % 60000) / 1000).toString().padStart(2, '0');
                document.getElementById('timer-display').innerText = `${h}:${m}:${s}`;
            }, 1000);
        }

        async function clockIn() {
            const res = await fetch('/api/shifts/clock-in', { method: 'POST' });
            if (res.ok) loadShiftData();
            else alert("Error clocking in.");
        }

        async function clockOut() {
            const res = await fetch('/api/shifts/clock-out', { method: 'POST' });
            if (res.ok) loadShiftData();
            else alert("Error clocking out.");
        }

        // Initial load
        init();
        // Check if they are on the shifts page by default (they aren't, but good to pre-load if needed)
        loadShiftData();

    </script>
</body>
</html>
