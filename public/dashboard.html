<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LCDOT | Employee Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #09090b; --bg-panel: #18181b; --sidebar: #121215; --text-main: #f4f4f5; --text-muted: #a1a1aa;
            --gold: #d4af37; --border: #27272a; --danger: #ef4444; --success: #22c55e;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-dark); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }

        .sidebar { width: 260px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .brand { padding: 1.5rem; border-bottom: 1px solid var(--border); text-align: center; }
        .brand h1 { font-size: 1rem; color: var(--gold); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
        .nav { padding: 1rem 0; flex: 1; }
        .nav-item { display: block; width: 100%; text-align: left; padding: 0.8rem 1.5rem; background: none; border: none; color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 500; border-left: 3px solid transparent; cursor: pointer; font-family: inherit; }
        .nav-item:hover { color: white; }
        .nav-item.active { color: var(--gold); border-left-color: var(--gold); background: rgba(212, 175, 55, 0.05); }
        .hidden { display: none !important; }
        
        .main { flex: 1; display: flex; flex-direction: column; overflow-y: auto; }
        .header { padding: 1rem 2rem; border-bottom: 1px solid var(--border); background: var(--bg-panel); display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 10; }
        .user-info { display: flex; align-items: center; gap: 1rem; }
        .user-info img { width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--border); }
        .user-info h2 { font-size: 0.9rem; }
        .user-info p { font-size: 0.75rem; color: var(--gold); font-weight: 600; }
        
        .content { padding: 2rem; flex: 1; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .page-title { font-size: 1.4rem; color: var(--gold); margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
        .panel { background: var(--bg-panel); border: 1px solid var(--border); padding: 1.5rem; margin-bottom: 1.5rem; }

        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        th { text-align: left; padding: 0.75rem; border-bottom: 1px solid var(--border); color: var(--text-muted); font-weight: 500; }
        td { padding: 0.75rem; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(255,255,255,0.02); }

        input, select { width: 100%; padding: 0.75rem; background: var(--bg-dark); border: 1px solid var(--border); color: white; font-family: inherit; margin-bottom: 1rem; border-radius: 4px; }
        .btn { background: var(--gold); color: #000; border: none; padding: 0.75rem 1.5rem; font-weight: 600; cursor: pointer; border-radius: 4px; }
        .btn-green { background: var(--success); color: white; }
        .btn-red { background: var(--danger); color: white; }
        
        .status { padding: 0.2rem 0.5rem; font-size: 0.75rem; font-weight: 600; border-radius: 4px; }
        .status-active { background: rgba(34, 197, 94, 0.2); color: var(--success); }
        .status-suspended { background: rgba(239, 68, 68, 0.2); color: var(--danger); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="brand"><h1>LCDOT Portal</h1></div>
        <div class="nav">
            <button onclick="switchPage('dashboard', this)" class="nav-item active">Dashboard</button>
            <button onclick="switchPage('directory', this)" class="nav-item">Employee Directory</button>
            <button onclick="switchPage('management', this)" id="nav-mgmt" class="nav-item hidden" style="color: var(--gold);">Management HQ</button>
        </div>
        <div style="padding: 1rem; border-top: 1px solid var(--border);">
            <a href="/auth/logout" style="display:block; text-align:center; color: #ef4444; text-decoration:none; font-size:0.85rem; padding: 0.5rem;">Log Out</a>
        </div>
    </aside>

    <main class="main">
        <header class="header">
            <div class="user-info">
                <img id="user-avatar" src="">
                <div>
                    <h2 id="user-name">Loading...</h2>
                    <p id="user-rank">...</p>
                </div>
            </div>
        </header>

        <div class="content">
            <div id="page-dashboard" class="page active">
                <h2 class="page-title">Dashboard</h2>
                <div class="panel">
                    <h2 style="font-size: 1.1rem; margin-bottom: 0.5rem;">Welcome to the Portal</h2>
                    <p style="color: var(--text-muted); font-size: 0.9rem;">Select a module from the sidebar to proceed.</p>
                </div>
            </div>

            <div id="page-directory" class="page">
                <h2 class="page-title">Employee Directory</h2>
                <div class="panel">
                    <table>
                        <thead>
                            <tr>
                                <th>Employee</th>
                                <th>Rank</th>
                                <th>Status</th>
                                <th>Total Hours</th>
                            </tr>
                        </thead>
                        <tbody id="directory-body">
                            <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div id="page-management" class="page">
                <h2 class="page-title">Management Headquarters</h2>
                <div class="panel">
                    <h3 style="margin-bottom: 1rem; color: var(--gold);">Personnel Action</h3>
                    <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">Enter a Discord ID to manage this user.</p>
                    
                    <input type="text" id="mgmt-target-id" placeholder="Target Discord ID (e.g. 1234567890)">
                    
                    <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                        <select id="mgmt-rank">
                            <option value="Junior Operator">Junior Operator</option>
                            <option value="Operator">Operator</option>
                            <option value="Senior Operator">Senior Operator</option>
                            <option value="Specialist">Specialist</option>
                            <option value="Crew Supervisor">Crew Supervisor</option>
                            <option value="Field Supervisor">Field Supervisor</option>
                            <option value="Management Team">Management Team</option>
                            <option value="Executive Board">Executive Board</option>
                        </select>
                        <button onclick="mgmtAction('Promote')" class="btn btn-green" style="width: 200px;">Promote</button>
                    </div>

                    <div style="display: flex; gap: 1rem;">
                        <button onclick="mgmtAction('Suspend')" class="btn btn-red" style="flex: 1;">Suspend User</button>
                        <button onclick="mgmtAction('Reinstate')" class="btn" style="flex: 1;">Reinstate User</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        let user = {};

        function switchPage(pageId, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            if (btn) btn.classList.add('active');
            
            if (pageId === 'directory') loadDirectory();
        }

        async function init() {
            const res = await fetch('/api/me');
            if (!res.ok) return window.location.href = '/';
            user = await res.json();
            
            document.getElementById('user-name').innerText = user.username;
            document.getElementById('user-rank').innerText = user.rank;
            document.getElementById('user-avatar').src = user.avatar_url;

            if (user.rankLevel >= 7) {
                document.getElementById('nav-mgmt').classList.remove('hidden');
            }
        }

        async function loadDirectory() {
            const res = await fetch('/api/directory');
            const users = await res.json();
            document.getElementById('directory-body').innerHTML = users.map(u => `
                <tr>
                    <td style="display:flex; align-items:center; gap:10px;">
                        <img src="${u.avatar_url}" style="width:24px; height:24px; border-radius:4px;">
                        <strong>${u.username}</strong>
                    </td>
                    <td>${u.rank}</td>
                    <td><span class="status ${u.status === 'Active' ? 'status-active' : 'status-suspended'}">${u.status}</span></td>
                    <td>${((u.total_minutes || 0) / 60).toFixed(1)} hrs</td>
                </tr>
            `).join('');
        }

        async function mgmtAction(action) {
            const targetId = document.getElementById('mgmt-target-id').value;
            const value = action === 'Promote' ? document.getElementById('mgmt-rank').value : '';
            
            if (!targetId) return alert("Please enter a Discord ID.");
            
            const res = await fetch('/api/management/action', {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ targetId, action, value })
            });
            
            if (res.ok) {
                alert(`${action} successful!`);
                document.getElementById('mgmt-target-id').value = '';
            } else {
                const err = await res.json();
                alert(`Failed: ${err.error}`);
            }
        }

        init();
    </script>
</body>
</html>
